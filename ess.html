<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESS Regents Study App</title>
<style>
  :root{ --teal:#0f5e54; --teal2:#137a6d; --amber:#c2711c; --green:#2f855a; --red:#c53030; --paper:#fff; --ink:#16302b; --line:#d9e2df; --soft:#eef4f2; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(160deg,#f3f8f6,#e4eeeb);color:var(--ink);line-height:1.5}
  .topbar{position:sticky;top:0;z-index:50}
  header{background:var(--teal);color:#fff;padding:16px;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  header h1{margin:0;font-size:19px;letter-spacing:.3px}
  header p{margin:4px 0 0;font-size:13px;opacity:.9}
  .stats{display:flex;justify-content:center;gap:10px;background:#0b463e;padding:8px 10px;border-top:1px solid #1d6b60}
  .stats .pill{background:rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:5px 13px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
  .stats .pill.xp{background:rgba(194,113,28,.3);color:#ffd9a8}
  .card.journey{background:#0f5e54;background:linear-gradient(135deg,#0f5e54,#137a6d);color:#fff;border:none}
  .journey h3{margin:0 0 4px;color:#fff;font-size:17px}
  .journey .sub{font-size:13px;opacity:.9;margin:0 0 12px}
  .vbar{position:relative;height:16px;background:#9fb7b1;border-radius:99px;overflow:visible;margin:18px 0 8px}
  .vfill{height:100%;background:linear-gradient(90deg,#3fa796,#7fd0c1);border-radius:99px;transition:width .6s}
  .vflag{position:absolute;top:-13px;transform:translateX(-50%);font-size:22px;transition:left .6s;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
  .vlabel{text-align:center;font-weight:700;font-size:15px;margin-bottom:12px}
  .terrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:7px}
  .terr{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:7px 5px;text-align:center;font-size:11px;opacity:.65;transition:.3s}
  .terr.won{background:rgba(127,208,193,.4);border-color:#9fe0d4;opacity:1;font-weight:700}
  .terr .tflag{font-size:18px;display:block;margin-bottom:2px}
  .victory{margin-top:14px;background:var(--amber);color:#fff;border-radius:12px;padding:12px;text-align:center;font-weight:800;font-size:16px}
  .resetlink{display:block;text-align:center;color:#8aa39d;font-size:12px;margin-top:14px;cursor:pointer;text-decoration:underline}
  #toasts{position:fixed;left:0;right:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:100}
  .toast{background:var(--teal);color:#ffd9a8;font-weight:800;padding:10px 18px;border-radius:99px;box-shadow:0 4px 14px rgba(0,0,0,.3);font-size:15px;animation:tp .4s ease,tf .4s ease 1.6s forwards}
  .toast.terr{background:var(--amber);color:#fff}
  @keyframes tp{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:none}}
  @keyframes tf{to{opacity:0;transform:translateY(-10px)}}
  .wrap{max-width:760px;margin:0 auto;padding:16px}
  .bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin:10px 0 4px}
  .bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--amber),#e0a155);transition:.4s}
  .barlabel{font-size:12px;color:#5a6b66;text-align:center;margin-bottom:6px}
  .btn{display:inline-block;border:none;cursor:pointer;font-size:16px;font-weight:600;border-radius:12px;padding:13px 18px;transition:transform .08s,box-shadow .2s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--teal2);color:#fff;box-shadow:0 3px 8px rgba(19,122,109,.3)}
  .btn.gold{background:var(--amber);color:#fff;box-shadow:0 3px 8px rgba(194,113,28,.35)}
  .btn.ghost{background:#fff;color:var(--teal2);border:2px solid var(--teal2)}
  .btn.block{display:block;width:100%;margin-top:10px;text-align:center}
  .card{background:var(--paper);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 12px rgba(0,0,0,.06);border:1px solid var(--line)}
  .secttitle{margin:18px 0 6px;color:var(--teal)}
  .daycard{cursor:pointer;display:flex;align-items:center;gap:14px}
  .daycard .dnum{flex-shrink:0;width:46px;height:46px;border-radius:12px;background:var(--teal2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
  .daycard .dbody{flex:1}
  .daycard .dbody h3{margin:0;font-size:15.5px}
  .daycard .dbody .dmeta{font-size:12px;color:#718096}
  .daycard .chev{color:#cbd5e0;font-size:22px}
  .ultimate{background:#fbf2e6;border:2px solid var(--amber)}
  .ultimate h3{color:var(--amber);margin:0}
  .topiccard{display:flex;align-items:center;gap:14px;cursor:pointer}
  .topiccard .emoji{font-size:26px;flex-shrink:0}
  .topiccard .t{flex:1}
  .topiccard .t h3{margin:0;font-size:15px}
  .topiccard .t span{font-size:12px;color:#718096}
  .check{font-size:20px;color:var(--green)}
  .check.todo{color:#cbd5e0}
  .summary{font-size:16px}
  .summary h2{color:var(--teal);margin-top:0;font-size:19px}
  .summary ul{padding-left:20px} .summary li{margin:6px 0}
  .tag{display:inline-block;background:var(--soft);color:var(--teal2);font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
  .flash{background:#fbf7ee;border:1px solid #ecdcbf;border-radius:14px;padding:14px;margin:12px 0}
  .flash .q{font-weight:600}
  .flash .qlabel{color:var(--amber);font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
  .ans{margin-top:10px;background:#e9f6ee;border:1px solid #b7e0c6;color:#22543d;border-radius:10px;padding:10px;display:none;font-weight:600}
  .ans.show{display:block;animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .flashin{display:block;width:100%;margin-top:10px;padding:11px 13px;font-size:15px;border:2px solid var(--line);border-radius:10px;outline:none;font-family:inherit}
  .flashin:focus{border-color:var(--teal2)} .flashin[readonly]{background:#f7fafc;color:#4a5568}
  .reveal{margin-top:10px;background:#fff;border:2px solid var(--amber);color:#9c6f0e;font-weight:700;border-radius:10px;padding:9px 14px;cursor:pointer;font-size:14px}
  .navrow{display:flex;gap:10px;margin-top:18px} .navrow .btn{flex:1}
  .qcount{font-size:13px;color:#718096;text-align:center;margin-bottom:6px}
  .qtext{font-size:18px;font-weight:700;color:var(--teal);margin-bottom:14px}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:13px 15px;margin:9px 0;font-size:15px;cursor:pointer;transition:.15s}
  .opt:hover{border-color:var(--teal2)}
  .opt.correct{background:#e9f6ee;border-color:var(--green);color:#22543d;font-weight:700}
  .opt.wrong{background:#fdecec;border-color:var(--red);color:#742a2a}
  .opt.disabled{cursor:default}
  .explain{margin-top:12px;background:var(--soft);border-radius:12px;padding:12px;font-size:14px;display:none}
  .explain.show{display:block} .explain b{color:var(--teal)}
  .scorebox{text-align:center;padding:10px}
  .scorebox .big{font-size:54px;font-weight:800;color:var(--teal)}
  .scorebox .msg{font-size:18px;margin:6px 0 16px;font-weight:600}
  .review h4{margin:18px 0 6px;color:var(--teal)}
  .ritem{font-size:14px;padding:10px;border-radius:10px;margin:6px 0;border:1px solid var(--line)}
  .ritem.ok{background:#f0faf4} .ritem.no{background:#fdf2f2} .ritem .icon{font-weight:800;margin-right:6px}
  footer{text-align:center;font-size:12px;color:#9fb0ab;padding:20px}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="topbar">
  <header>
    <h1>🌍 ESS Regents: Journey to Mastery</h1>
    <p>Study your way from Earth's core to the edge of the cosmos!</p>
  </header>
  <div id="stats" class="stats"></div>
</div>
<div class="wrap" id="app"></div>
<footer>Earth &amp; Space Science Regents study app • Read · Check · Quiz</footer>
<div id="toasts"></div>
<script>
/* ===================== CONTENT ===================== */
const UNITS = [
 { n:1, title:"Earth's Systems & Spheres", topics:[
   {emoji:"🌐", title:"The Four Spheres", summary:`<span class="tag">Unit 1</span>
     <p>Earth is one connected, ever-changing system made of four interacting <b>spheres</b>:</p>
     <ul><li><b>Geosphere</b> — the solid Earth (rocks, minerals, landforms, interior).</li>
     <li><b>Atmosphere</b> — the gases around Earth; the lowest layer, the <b>troposphere</b>, is where weather happens.</li>
     <li><b>Hydrosphere</b> — all of Earth's water.</li>
     <li><b>Biosphere</b> — all living things.</li></ul>
     <p>When two spheres shape each other over time, that's <b>coevolution</b> (early life made oxygen that changed the air). The natural events shaping the geosphere are <b>geologic processes</b>.</p>`,
     flash:[{q:`Which layer of the atmosphere has our weather?`,a:`The troposphere (the lowest layer).`},
            {q:`What is coevolution?`,a:`When two or more spheres influence each other's change over time.`}]},
   {emoji:"🔁", title:"Feedback & Scale Vocabulary", summary:`<span class="tag">Unit 1</span>
     <p>A <b>feedback</b> is when a system's output loops back to affect the system:</p>
     <ul><li><b>Positive feedback amplifies change</b> — melting ice → less reflection (lower albedo) → more warming → more melting.</li>
     <li><b>Negative feedback stabilizes</b> — more warming → more clouds → more sunlight reflected → cooling.</li></ul>
     <p>Use scale words precisely: <b>spatial range</b> = the area something covers; <b>spatial scale</b> = local vs. global; <b>temporal range</b> = how long something exists; <b>temporal change</b> = change over time. <b>Dynamic</b> = always changing.</p>`,
     flash:[{q:`Melting ice → less reflection → more melting. Which type of feedback?`,a:`Positive feedback (it amplifies the change).`},
            {q:`Spatial scale vs. spatial range?`,a:`Scale = the size of area studied (local/global); range = the actual area something covers.`}]}
 ]},
 { n:2, title:"Rocks & Minerals", topics:[
   {emoji:"💎", title:"Minerals", summary:`<span class="tag">Unit 2</span>
     <p>A <b>mineral</b> is <b>naturally occurring, inorganic, solid</b>, with a <b>definite chemical composition</b> and a <b>crystalline structure</b>. Minerals are the building blocks of rocks.</p>
     <p>They're identified by physical <b>properties</b>: color, <b>streak</b> (powder color), <b>luster</b>, <b>hardness</b>, <b>cleavage</b>, and density. (ESSRT p.16–17 has the ID flowchart.)</p>`,
     flash:[{q:`Name three things that make something a mineral.`,a:`Any of: naturally occurring, inorganic, solid, definite chemical composition, crystalline.`},
            {q:`What is "streak"?`,a:`The color of a mineral's powder — a property used to identify it.`}]},
   {emoji:"🪨", title:"The Rock Cycle", summary:`<span class="tag">Unit 2</span>
     <ul><li><b>Igneous</b> — cooled magma/lava. Slow cooling underground (intrusive) → <b>large crystals</b>; fast cooling at surface (extrusive) → fine/glassy.</li>
     <li><b>Sedimentary</b> — compaction &amp; cementation of sediment; often <b>layered</b>, may hold <b>fossils</b>.</li>
     <li><b>Metamorphic</b> — existing rock changed by <b>heat &amp; pressure</b> (marble from limestone).</li></ul>
     <p>The cycle is continuous with <b>no starting point</b> — any rock can become any other. <b>Bowen's Reaction Series</b> (ESSRT p.13) shows the order minerals crystallize from magma.</p>`,
     flash:[{q:`Igneous rock with large crystals — fast or slow cooling, and where?`,a:`Slow cooling, deep underground (intrusive).`},
            {q:`Which rock type is layered and may contain fossils?`,a:`Sedimentary rock.`}]}
 ]},
 { n:3, title:"Plate Tectonics", topics:[
   {emoji:"🌋", title:"Earth's Interior & Convection", summary:`<span class="tag">Unit 3</span>
     <p>Earth's layers (outside in): <b>crust</b>, <b>solid mantle</b>, <b>liquid outer core</b>, <b>solid inner core</b>. The <b>lithosphere</b> (crust + upper mantle) is broken into <b>tectonic plates</b>.</p>
     <p>Plates move by <b>thermal convection</b> in the mantle — heat (largely from <b>radioactive decay</b> of uranium, thorium, potassium) makes material rise while gravity pulls denser material down.</p>`,
     flash:[{q:`What are Earth's four interior layers, outside in?`,a:`Crust, solid mantle, liquid outer core, solid inner core.`},
            {q:`What drives plate motion, and where does the heat come from?`,a:`Thermal convection in the mantle; heat from radioactive decay inside Earth.`}]},
   {emoji:"🗺️", title:"Plate Boundaries & Evidence", summary:`<span class="tag">Unit 3</span>
     <ul><li><b>Divergent</b> — plates move apart; new crust forms (sea-floor spreading).</li>
     <li><b>Convergent</b> — plates collide; mountains, volcanoes, trenches.</li>
     <li><b>Transform</b> — plates slide past each other; earthquakes.</li></ul>
     <p><b>Hotspots</b> make volcanoes away from boundaries (Hawaii). Evidence for tectonics: <b>paleomagnetism</b>, matching continent shapes, and identical <b>fossils on now-separated continents</b>.</p>`,
     flash:[{q:`At which boundary does new ocean crust form by sea-floor spreading?`,a:`A divergent boundary.`},
            {q:`Name one piece of evidence for plate tectonics.`,a:`Paleomagnetism, matching coastlines, or matching fossils on separated continents.`}]},
   {emoji:"📳", title:"Earthquakes & Seismic Waves", summary:`<span class="tag">Unit 3</span>
     <ul><li><b>P-waves</b> — fastest; travel through solids, liquids, and gases.</li>
     <li><b>S-waves</b> — slower; travel <b>only through solids</b>.</li>
     <li><b>Surface waves</b> (Love &amp; Rayleigh) — slowest but cause the <b>most damage</b>.</li></ul>
     <p>The <b>epicenter</b> is the surface point above the focus. <b>Magnitude</b> = energy released; <b>intensity</b> = shaking. <b>Tsunamis</b> are giant waves from undersea quakes — fast in deep water, tall near shore.</p>`,
     flash:[{q:`Which seismic wave is fastest and travels through liquids?`,a:`The P-wave (primary wave).`},
            {q:`What's the epicenter?`,a:`The point on Earth's surface directly above the earthquake's focus.`}]}
 ]},
 { n:4, title:"Water & Earth's Surface", topics:[
   {emoji:"💧", title:"Water's Special Properties", summary:`<span class="tag">Unit 4</span>
     <p>Liquid water drives Earth's surface processes because it can:</p>
     <ul><li>absorb, store &amp; release lots of <b>energy</b> (moderates climate),</li>
     <li><b>transmit sunlight</b>,</li><li><b>expand when it freezes</b> (ice floats &amp; cracks rock),</li>
     <li><b>dissolve and transport</b> materials (the "universal solvent").</li></ul>`,
     flash:[{q:`Why does freezing water crack rocks?`,a:`Water expands when it freezes, prying cracks apart (frost wedging).`},
            {q:`Why is water called the "universal solvent"?`,a:`It dissolves and transports many materials.`}]},
   {emoji:"⛰️", title:"Weathering, Erosion & Deposition", summary:`<span class="tag">Unit 4</span>
     <p><b>Mechanical weathering</b> breaks rock without changing it: <b>frost wedging</b>, <b>abrasion</b>. <b>Chemical weathering</b> changes its chemistry: <b>oxidation</b> (rust), <b>hydrolysis</b>, <b>carbonation</b>, <b>dissolution</b>.</p>
     <p><b>Erosion</b> transports sediment (rivers, glaciers, wind, waves); <b>deposition</b> drops it, building deltas and beaches. Glaciers carve <b>U-shaped valleys</b>.</p>`,
     flash:[{q:`Is rusting (oxidation) mechanical or chemical weathering?`,a:`Chemical weathering.`},
            {q:`What's the difference between weathering and erosion?`,a:`Weathering breaks rock down in place; erosion transports the pieces away.`}]},
   {emoji:"🚰", title:"Groundwater", summary:`<span class="tag">Unit 4</span>
     <p>Rain either soaks in (<b>infiltration</b>) or flows off (<b>runoff</b>); some returns to air via <b>evapotranspiration</b>. The <b>water table</b> separates the dry zone above from the saturated groundwater zone below.</p>
     <ul><li><b>Porosity</b> — open space to <i>hold</i> water.</li><li><b>Permeability</b> — how easily water <i>flows through</i>.</li></ul>`,
     flash:[{q:`Porosity vs. permeability?`,a:`Porosity = space to hold water; permeability = how easily water flows through it.`},
            {q:`What is the water table?`,a:`The boundary between the unsaturated zone and the saturated (groundwater) zone.`}]}
 ]},
 { n:5, title:"Earth's History & Dating", topics:[
   {emoji:"⏳", title:"Radiometric Dating", summary:`<span class="tag">Unit 5</span>
     <p>Unstable atoms decay at a steady rate (<b>exponential decay</b>). The time for half a sample to decay is its <b>half-life</b>. Scientists use known half-lives (ESSRT p.15) for <b>radiometric dating</b> of rocks and fossils. Earth is about <b>4.6 billion years</b> old.</p>
     <p>The <b>oldest minerals on Earth, the Moon, and Mars are about the same age</b> — strong evidence they all formed together.</p>`,
     flash:[{q:`What is a half-life?`,a:`The time it takes for half of a radioactive sample to decay.`},
            {q:`About how old are Earth and the solar system?`,a:`About 4.6 billion years.`}]},
   {emoji:"🪐", title:"Forming the Solar System", summary:`<span class="tag">Unit 5</span>
     <p>~4.6 bya a <b>solar nebula</b> (gas &amp; dust) collapsed and spun, forming the Sun and a disk. Particles stuck together by <b>accretion</b> into <b>planetesimals</b> → planets. The <b>Late Heavy Bombardment</b> then cratered the young planets.</p>
     <p>Earth's oldest rocks were destroyed by plate tectonics and erosion, so we study the <b>Moon, asteroids, and meteorites</b> (barely changed) to learn about early Earth.</p>`,
     flash:[{q:`What is accretion?`,a:`The clumping-together of dust and gas that built planetesimals and planets.`},
            {q:`Why study Moon rocks and meteorites to learn about early Earth?`,a:`They've changed little in billions of years, while Earth's oldest rocks were destroyed.`}]},
   {emoji:"🦠", title:"Coevolution & Mass Extinctions", summary:`<span class="tag">Unit 5</span>
     <p>Life remade the planet: <b>cyanobacteria</b> began <b>photosynthesis</b> (~3.5 bya), making oxygen → <b>Banded Iron Formations</b> → the <b>Great Oxidation Event</b> (~2.4 bya) → eukaryotes → multicellular life → the <b>Cambrian Explosion</b> → land life → mammals → hominins.</p>
     <p><b>Mass extinctions</b> (asteroid impacts, huge volcanic eruptions, climate change) repeatedly wiped out species and let new groups rise.</p>`,
     flash:[{q:`What process let early life add oxygen to the atmosphere?`,a:`Photosynthesis by cyanobacteria.`},
            {q:`Name a cause of mass extinctions.`,a:`Asteroid impacts, massive volcanic eruptions, or rapid climate change.`}]}
 ]},
 { n:6, title:"Earth, Moon & Sun", topics:[
   {emoji:"🌎", title:"Earth's Motions", summary:`<span class="tag">Unit 6</span>
     <p><b>Rotation</b> (spin, ~24 h) causes <b>day &amp; night</b> and the Sun's apparent east-to-west path. Proofs: <b>star trails</b>, the <b>Foucault pendulum</b>, and the <b>Coriolis effect</b>. <b>Revolution</b> (orbit, ~365 d) gives us the year.</p>`,
     flash:[{q:`What causes day and night?`,a:`Earth's rotation on its axis.`},
            {q:`Name one proof of Earth's rotation.`,a:`Star trails, the Foucault pendulum, or the Coriolis effect.`}]},
   {emoji:"🌙", title:"Phases & Eclipses", summary:`<span class="tag">Unit 6</span>
     <p>The Moon's <b>phases</b> come from the changing Earth-Moon-Sun positions over a ~<b>29.5-day</b> cycle (new → crescent → quarter → gibbous → full …).</p>
     <p>Eclipses need alignment: a <b>solar eclipse</b> happens at a <b>new Moon</b>; a <b>lunar eclipse</b> happens at a <b>full Moon</b>.</p>`,
     flash:[{q:`A lunar eclipse can only happen during which phase?`,a:`A full Moon.`},
            {q:`About how long is the Moon's phase cycle?`,a:`About 29.5 days.`}]},
   {emoji:"🌊", title:"Tides & Seasons", summary:`<span class="tag">Unit 6</span>
     <p><b>Tides</b> are caused mainly by the <b>Moon's gravity</b>. <b>Spring tides</b> (biggest range) happen when Sun-Moon-Earth are <b>aligned</b> (new/full Moon); <b>neap tides</b> (smallest) when they're at <b>right angles</b> (quarter Moons).</p>
     <p><b>Seasons</b> are caused by Earth's <b>23.5° axial tilt</b> — <b>not</b> its distance from the Sun. The hemisphere tilted toward the Sun gets more direct light = summer.</p>`,
     flash:[{q:`What really causes the seasons?`,a:`The 23.5° tilt of Earth's axis (not distance from the Sun).`},
            {q:`When do spring tides (largest range) occur?`,a:`When the Sun, Moon, and Earth are aligned — at new or full Moon.`}]}
 ]},
 { n:7, title:"Stars & the Universe", topics:[
   {emoji:"☀️", title:"Fusion, Spectra & Elements", summary:`<span class="tag">Unit 7</span>
     <p>Stars shine by <b>nuclear fusion</b> (hydrogen → helium; lost mass → energy). A star's <b>initial mass</b> determines its life and lifespan. Elements form <b>up to iron</b> in normal stars; <b>heavier than iron</b> only in <b>supernovae</b>.</p>
     <p>Each element emits/absorbs <b>characteristic wavelengths</b>, so a star's <b>spectrum</b> reveals what it's made of and how it moves.</p>`,
     flash:[{q:`How do stars produce energy?`,a:`Nuclear fusion of hydrogen into helium (lost mass becomes energy).`},
            {q:`Where are elements heavier than iron made?`,a:`In supernova explosions of massive stars.`}]},
   {emoji:"🔭", title:"H-R Diagram & Star Life Cycles", summary:`<span class="tag">Unit 7</span>
     <p>The <b>H-R diagram</b> (ESSRT p.4) plots <b>temperature</b> vs. <b>brightness</b>. Groups: main sequence, giants, supergiants, white dwarfs. <b>Lower (or negative) absolute magnitude = brighter</b> star. Temperature sets color (blue hot, red cool).</p>
     <p>The <b>Sun</b> is a main-sequence star. Its layers (in→out): core → radiative zone → convective zone → photosphere → chromosphere → corona.</p>`,
     flash:[{q:`On the H-R diagram, what is the Sun classified as?`,a:`A main-sequence star.`},
            {q:`A star with a lower (more negative) absolute magnitude is…?`,a:`Brighter.`}]},
   {emoji:"💥", title:"Solar System & the Big Bang", summary:`<span class="tag">Unit 7</span>
     <p>The solar system is <b>heliocentric</b>, inside the <b>Milky Way</b>. The <b>transit method</b> finds exoplanets (a planet dims its star's light). <b>Kepler's laws</b>: orbits are ellipses; planets move faster when closer to the Sun; farther planets take longer.</p>

function unit(n){

/* ---------- QUIZ ---------- */
let qi=0,answers=[],QZ=[],quizMode='ALL';
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}
function buildQuiz(mode){const pool=mode==='ALL'?QUESTIONS.slice():QUESTIONS.filter(q=>q.u===mode);
  QZ=pool.map(it=>{const o=it.o.map((text,idx)=>({text,correct:idx===it.c}));shuffle(o);return{id:it.id,q:it.q,o:o.map(x=>x.text),c:o.findIndex(x=>x.correct),e:it.e}});shuffle(QZ)}
function startQuiz(mode){quizMode=mode;qi=0;answers=[];buildQuiz(mode);question()}
function quizTitle(){return quizMode==='ALL'?'Ultimate Review':'Unit '+quizMode+' Quiz'}
function question(){const it=QZ[qi];
  let html=`<div class="card"><div class="qcount">${quizTitle()} · Question ${qi+1} of ${QZ.length}</div>
    <div class="bar"><div style="width:${Math.round(qi/QZ.length*100)}%"></div></div><div class="qtext">${it.q}</div>`;
  it.o.forEach((opt,k)=>{html+=`<button class="opt" onclick="answer(${k})">${opt}</button>`});
  html+=`<div class="explain"></div><button class="btn primary block hidden" id="nextbtn" onclick="next()">${qi<QZ.length-1?'Next →':'See my score 🎉'}</button>
    <button class="btn ghost block" style="margin-top:14px" onclick="${quizMode==='ALL'?'home()':'unit('+quizMode+')'}">Quit quiz</button></div>`;
  app.innerHTML=html;window.scrollTo(0,0)}
function answer(k){const it=QZ[qi];if(answers[qi]!==undefined)return;answers[qi]=k;
  app.querySelectorAll('.opt').forEach((b,idx)=>{b.classList.add('disabled');b.onclick=null;if(idx===it.c)b.classList.add('correct');if(idx===k&&k!==it.c)b.classList.add('wrong')});
  const ex=app.querySelector('.explain');ex.innerHTML=(k===it.c?'✅ <b>Correct!</b> ':'❌ <b>Not quite.</b> ')+it.e;ex.classList.add('show');
  if(k===it.c)addXP(10,'q_'+it.id,'Correct!');app.querySelector('#nextbtn').classList.remove('hidden')}
function next(){if(qi<QZ.length-1){qi++;question()}else results()}
function results(){let score=0;answers.forEach((a,i)=>{if(a===QZ[i].c)score++});
  if(quizMode==='ALL'&&score===QZ.length)addXP(100,'perfect_all','PERFECT ULTIMATE REVIEW!');
  const pct=Math.round(score/QZ.length*100);let msg,color;
  if(pct>=90){msg="Outstanding — Regents-ready! 🏆";color="var(--green)"}else if(pct>=75){msg="Great work — almost there! 💪";color="var(--green)"}
  else if(pct>=60){msg="Good start — review the misses. 📖";color="var(--amber)"}else{msg="Keep studying — you've got this! 📚";color="var(--red)"}
  let html=`<div class="card scorebox"><div class="big" style="color:${color}">${score}/${QZ.length}</div><div class="msg">${msg}</div>
      <button class="btn gold" onclick="startQuiz('${quizMode}')">↻ Retake</button>
      <button class="btn ghost block" onclick="${quizMode==='ALL'?'home()':'unit('+quizMode+')'}">${quizMode==='ALL'?'Back to home':'Back to Unit '+quizMode}</button></div>
    <div class="card review"><h4>Review your answers</h4>`;
  QZ.forEach((it,i)=>{const a=answers[i],ok=a===it.c;
    html+=`<div class="ritem ${ok?'ok':'no'}"><span class="icon">${ok?'✅':'❌'}</span>${it.q}<br><b>Answer:</b> ${it.o[it.c]}${!ok?`<br><span style="color:var(--red)">You chose: ${it.o[a]}</span>`:''}<br><span style="color:#5a6b66">${it.e}</span></div>`});
  html+=`</div>`;app.innerHTML=html;window.scrollTo(0,0)}
/* ---------- CONSTRUCTED RESPONSE (Claude-graded) ---------- */
const CR_QUESTIONS = [
 {id:'cr1', prompt:`Explain why igneous rock that cools slowly deep underground forms larger crystals than rock that cools quickly at the surface.`,
  rubric:`Must connect SLOW cooling to MORE TIME for crystals to grow → LARGER crystals (and/or fast cooling = less time = small/fine/glassy).`, maxCredit:1,
  sample:`When magma cools slowly underground, there is more time for crystals to grow, so they become large. Lava that cools quickly at the surface gives crystals little time to form, so they stay small or glassy.`},
 {id:'cr2', prompt:`Using cause and effect, explain how burning fossil fuels leads to global warming.`,
  rubric:`Must show the chain: burning fossil fuels releases CO₂ (a greenhouse gas) → greenhouse gases trap heat → average global temperature rises.`, maxCredit:1,
  sample:`Burning fossil fuels releases carbon dioxide, a greenhouse gas. Greenhouse gases trap heat in the atmosphere, so as their amount increases, Earth's average temperature rises.`},
 {id:'cr3', prompt:`A student says the seasons are caused by Earth being closer to the Sun in summer. Construct an argument explaining why this is incorrect.`,
  rubric:`Must state seasons are caused by Earth's 23.5° axial TILT (not distance), and that the tilt changes the directness/angle of sunlight and the length of day for each hemisphere.`, maxCredit:1,
  sample:`The seasons are not caused by distance. Earth's axis is tilted 23.5°. The hemisphere tilted toward the Sun gets more direct sunlight and longer days (summer); the one tilted away gets less direct light and shorter days (winter).`},
 {id:'cr4', prompt:`Explain how the phases of the Moon are produced.`,
  rubric:`Must say phases come from the changing positions of the Earth, Moon, and Sun, so we see different amounts of the Moon's sunlit half (cycle ~29.5 days).`, maxCredit:1,
  sample:`As the Moon orbits Earth, the positions of the Earth, Moon, and Sun change, so we see different amounts of the Moon's lit half. This cycle of phases repeats about every 29.5 days.`},
 {id:'cr5', prompt:`Earthquake S-waves do not pass through Earth's outer core, but P-waves do. Use this evidence to explain what it tells scientists about the outer core.`,
  rubric:`Must use that S-waves travel only through SOLIDS while P-waves also travel through liquids; since S-waves don't pass through the outer core, the outer core must be LIQUID.`, maxCredit:1,
  sample:`S-waves can only travel through solids, while P-waves can also travel through liquids. Because S-waves cannot pass through the outer core but P-waves can, the outer core must be liquid.`},
 {id:'cr6', prompt:`Explain how melting sea ice creates a positive feedback loop that increases warming.`,
  rubric:`Must show the loop: melting ice lowers albedo (less reflection) → darker surface absorbs more sunlight/heat → more warming → even more ice melts.`, maxCredit:1,
  sample:`When sea ice melts, it exposes darker ocean, lowering Earth's albedo. The darker water absorbs more sunlight instead of reflecting it, causing more warming, which melts even more ice — a positive feedback loop.`},
 {id:'cr7', prompt:`Construct an explanation for how the redshift of distant galaxies supports the Big Bang theory.`,
  rubric:`Must say light from distant galaxies is shifted to longer (red) wavelengths → galaxies moving away; farther galaxies move faster → the universe is expanding (supporting the Big Bang).`, maxCredit:1,
  sample:`Light from distant galaxies is stretched toward longer, redder wavelengths, which means the galaxies are moving away. The farther a galaxy is, the faster it moves away, showing the universe is expanding — evidence it began with the Big Bang.`},
 {id:'cr8', prompt:`Explain why scientists study Moon rocks and meteorites to learn about Earth's earliest history.`,
  rubric:`Must say Earth's oldest rocks were destroyed/changed by plate tectonics and erosion, while the Moon/meteorites have changed very little, so they preserve a record of the early solar system.`, maxCredit:1,
  sample:`Most of Earth's oldest rocks were destroyed or changed by plate tectonics and erosion. The Moon and meteorites have barely changed in billions of years, so they preserve a record of the early solar system and early Earth.`},
 {id:'cr9', prompt:`Explain how convection currents in the mantle cause Earth's tectonic plates to move.`,
  rubric:`Must say heat (from the core/radioactive decay) makes mantle rock rise, then it cools and sinks, forming convection currents; these currents drag/push the plates above them, moving them.`, maxCredit:1,
  sample:`Heat from Earth's interior warms the mantle, making the hot rock rise. As it cools near the surface it sinks again, creating convection currents. These slow-moving currents drag the tectonic plates above them, causing the plates to move.`},
 {id:'cr10', prompt:`A rock contains a radioactive element with a half-life of 1.3 billion years. Explain how a scientist could use this to estimate the rock's age.`,
  rubric:`Must explain that the radioactive element decays into a stable product at a known rate (half-life = time for half to decay), so by measuring the ratio of remaining element to decay product, the scientist counts how many half-lives have passed and multiplies to find the age.`, maxCredit:1,
  sample:`The radioactive element decays into a stable product at a steady rate — every half-life (1.3 billion years) half of what remains decays. By measuring the ratio of leftover radioactive element to its decay product, the scientist figures out how many half-lives have passed and multiplies by 1.3 billion years to estimate the rock's age.`}
];
let crOrder=[], crIdx=0;
function graderUrl(){ try{return localStorage.getItem('ess_grader_url')||''}catch(e){return ''} }
function setGraderUrl(){ const u=prompt('Paste your grader Worker URL (https://...workers.dev):', graderUrl()); if(u!==null){ try{localStorage.setItem('ess_grader_url',u.trim())}catch(e){} crHome(); } }
function crHome(){
  renderStats();
  const url=graderUrl();
  let html=`<div class="card summary"><span class="tag">Written-Answer Practice</span><h2 style="margin:4px 0 0;color:var(--teal)">✍️ Constructed Response</h2>
    <p style="font-size:14px;color:#5a6b66">About 40% of the real Regents is written answers. Type an answer below and Claude grades it like a Regents scorer — with specific feedback on what would earn full credit.</p></div>`;
  if(!url){
    html+=`<div class="card" style="border:2px solid var(--amber)"><h3 style="margin-top:0;color:var(--amber)">One-time setup</h3>
      <p style="font-size:14px">A grown-up sets up a tiny free "grader" once (it keeps the API key private). After the setup steps, paste the grader's web address here.</p>
      <button class="btn gold block" onclick="setGraderUrl()">Paste grader URL</button>
      <button class="btn ghost block" onclick="home()">← Back to home</button></div>`;
    app.innerHTML=html;window.scrollTo(0,0);return;
  }
  html+=`<div class="card" style="text-align:center"><p style="margin:0 0 10px">${CR_QUESTIONS.length} written-answer prompts ready.</p>
      <button class="btn gold block" onclick="crStart()">Start practicing →</button>
      <button class="btn ghost block" onclick="setGraderUrl()">Change grader URL</button>
      <button class="btn ghost block" onclick="home()">← Back to home</button></div>`;
  app.innerHTML=html;window.scrollTo(0,0);
}
function crStart(){ crOrder=shuffle(CR_QUESTIONS.map((_,i)=>i)); crIdx=0; crQuestion(); }
function crQuestion(){
  const q=CR_QUESTIONS[crOrder[crIdx]];
  let html=`<div class="card"><div class="qcount">Written Answer ${crIdx+1} of ${crOrder.length}</div>
    <div class="qtext">${q.prompt}</div>
    <textarea id="craInput" placeholder="Type your answer…" autocomplete="off" style="width:100%;min-height:120px;padding:12px;font-size:15px;border:2px solid var(--line);border-radius:10px;font-family:inherit;outline:none"></textarea>
    <button class="btn gold block" id="crsubmit" onclick="crGrade()">Submit for grading</button>
    <div id="crresult"></div>
    <button class="reveal" onclick="document.getElementById('crsample').classList.add('show');this.style.display='none'">Show a model answer</button>
    <div class="ans" id="crsample">✓ ${q.sample}</div>
    <button class="btn ghost block" onclick="crHome()" style="margin-top:14px">Quit</button>
  </div>`;
  app.innerHTML=html;window.scrollTo(0,0);
}
async function crGrade(){
  const q=CR_QUESTIONS[crOrder[crIdx]];
  const inp=document.getElementById('craInput'); const ans=(inp.value||'').trim();
  if(ans.length<3){ inp.focus(); return; }
  const btn=document.getElementById('crsubmit'); btn.textContent='Grading…'; btn.disabled=true;
  const res=document.getElementById('crresult');
  res.innerHTML=`<div class="explain show">⏳ Claude is grading your answer…</div>`;
  try{
    const r=await fetch(graderUrl(),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:q.prompt,rubric:q.rubric,maxCredit:q.maxCredit,studentAnswer:ans})});
    const d=await r.json();
    if(d.error){ res.innerHTML=`<div class="explain show" style="border-left:4px solid var(--red)">⚠️ ${d.error}${d.detail?'<br><small>'+(''+d.detail).slice(0,200)+'</small>':''}</div>`; btn.textContent='Try again'; btn.disabled=false; return; }
    const got=(typeof d.credit==='number')?d.credit:0, max=d.maxCredit||q.maxCredit;
    const color=d.verdict==='full'?'var(--green)':(d.verdict==='partial'?'var(--amber)':'var(--red)');
    const miss=(d.missing&&d.missing.length)?`<br><b>For full credit:</b> ${d.missing.join('; ')}`:'';
    res.innerHTML=`<div class="explain show" style="border-left:4px solid ${color}"><b style="color:${color}">Score: ${got}/${max}</b><br>${d.feedback||''}${miss}</div>`;
    addXP(got*10,'cr_'+q.id,'Written answer graded!');
    btn.style.display='none';
    const nx=document.createElement('button'); nx.className='btn primary block'; nx.textContent=(crIdx<crOrder.length-1)?'Next prompt →':'Done ✓';
    nx.onclick=function(){ if(crIdx<crOrder.length-1){crIdx++;crQuestion();}else crHome(); };
    res.appendChild(nx);
  }catch(e){
    res.innerHTML=`<div class="explain show" style="border-left:4px solid var(--red)">⚠️ Couldn't reach the grader. Check the grader URL (Change grader URL) and your connection.</div>`;
    btn.textContent='Try again'; btn.disabled=false;
  }
}

home();
